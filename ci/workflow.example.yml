# EXAMPLE ONLY: written for GitHub Actions but never run on a CI system (this project is not in a git repository yet).
name: cag-gate
on:
  pull_request:
  schedule: [{cron: "0 3 * * *"}]          # nightly model tier
jobs:
  fast:                                     # every pull request: seconds, no model, no GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: make gate-fast                 # fails if the corpus, questions or prompt changed without a re-run of the model tier
      - run: make gate-baseline             # the committed baseline answers must still pass the committed thresholds
  model:                                    # nightly and before a release: needs Ollama + the 32B model on a self-hosted runner
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, gpu-32gb]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --python 3.12
      - run: OLLAMA_HOST=127.0.0.1:11435 OLLAMA_NUM_PARALLEL=1 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve &
      - run: make gate-model                # exit 1 = regression: unanswerable refusals, correctness, false refusals or cache hit ratio below the thresholds
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gate-reports, path: reports/gate-*}
